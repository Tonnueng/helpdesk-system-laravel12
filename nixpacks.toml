[phases.setup]
nixPkgs = ["nodejs"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader", "npm install", "npm run build"]

[phases.build]
cmds = ["mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs", "chmod -R 775 storage bootstrap/cache", "touch database/database.sqlite", "php artisan migrate --force", "php artisan db:seed --force", "php artisan storage:link", "php artisan config:clear", "php artisan cache:clear", "php artisan view:clear"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
